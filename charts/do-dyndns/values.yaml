# Default values for do-dyndns.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: hellstromitltd/do-dyndns
  pullPolicy: Always
  # Overrides the image tag whose default is the chart version.
  # tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

digitalocean:
  # DigitalOcean API token. Stored in a Secret created by the chart.
  token: ""
  # Use an existing Secret instead of creating one. When set, token is ignored.
  existingSecret: ""
  # Key in the existing Secret that holds the token.
  existingSecretKey: "token"

dyndns:
  configyml: |-
    interval: 60
    ifconfig:
      host: "https://api.ipify.org"
      uri: "/?format=json"
    domains:
      - "test.<yourdomain>.<tld>"
      - "test2.<yourdomain>.<tld>"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # The app does not talk to the Kubernetes API, so the token is not mounted
  automount: false

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
